<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Federo&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../global.css">
    <script src="../JS/config.js"></script>
    <script type="module" src="../JS/activities.js"></script>
    <title>Aktiviteter</title>
</head>

<body>
    <nav>
        <ul>
            <li>
                <p id="h-logo">Namn</p>
            </li>
            <li><a href="index.html">Hem</a></li>
            <li id="current-page"><a href="activities.html">Aktiviteter</a></li>
            <li><a href="favorite.html">Favoriter</a></li>
            <li><a href="about.html">Om oss</a></li>
        </ul>
    </nav>

    <header id="hero">
        <h1>Aktiviteter</h1>
    </header>

    <main>
        <div id="filters">
            <div id="event-flex">
                <a href="activities.html" class="spec-event">Svensexa / Möhippa</a>
                <a href="activities.html" class="spec-event">Teambuilding / AW</a>
                <a href="activities.html" class="spec-event">Kick-off</a>
            </div>

            <div id="search-flex">
                <input type="search" class="search" placeholder="Sök här">
                <button class="search-btn">Sök</button>
            </div>

            <div id="filter-fold-section">

                <div id="top-fold-sec">
                    <label for="sortfilter">Sortera</label>
                    <select id="sortfilter">
                        <option value="standard">Standard</option>
                        <option value="rating-high">Högst betyg först</option>
                        <option value="rating-low">Lägst betyg först</option>
                        <option value="price-low">Lägst pris först</option>
                        <option value="price-high">Högst pris först</option>
                    </select>
                    <img src="../SVG/sort.svg" alt="Byt ordning på sortering" id="sorting">

                    <label for="max-price">Maxpris</label>
                    <input type="range" id="max-price" min="0" max="10" value="10"><span id="price-span">Ej satt</span>

                    <p>Fäll ut</p>
                    <img src="../SVG/hamburger.svg" alt="Hamburgarmeny">
                </div>

                <div id="bottom-fold-sec" class="visible">

                    <span>
                        <label for="physical">Max fysisk ansträngning</label>
                        <input type="range" id="physical" min="1" max="3" value="3"><span id="physical-span"><img src="../SVG/physical.svg" alt="Hög fysisk nivå"></span>
                    </span>

                    <span>
                        <label for="provincefilter">Landskap</label>
                        <select id="provincefilter">
                            <option value="Alla">Alla</option>
                            <option value="Småland">Småland</option>
                            <option value="Öland">Öland</option>
                        </select>
                    </span>
                    <span>
                        <label for="pricefilter">Pris</label>
                        <select id="pricefilter">
                            <option value="Alla">Alla</option>
                            <option value="100-250">100-250 kr</option>
                            <option value="250-500">250-500 kr</option>
                            <option value="500-1000">500-1000 kr</option>
                        </select>
                    </span>
                    <span>
                        <label for="outdoorfilter">Utomhus</label>
                        <select id="outdoorfilter">
                            <option value="Alla">Inomhus/utomhus</option>
                            <option value="Y">Utomhus</option>
                            <option value="N">Inomhus</option>
                        </select>
                    </span>
                    <fieldset>
                        <legend>Aktiviteter</legend>

                        <input type="checkbox" id="Bowling" name="aktiviteter" value="Bowlinghall">
                        <label for="Bowling">Bowling</label>

                        <input type="checkbox" id="Gokart" name="aktiviteter" value="Gokart">
                        <label for="Gokart">Gokart</label>

                        <input type="checkbox" id="Golf" name="aktiviteter" value="Golfbana">
                        <label for="Golf">Golfbanor</label>
                        <!-- Ska vi verkligen ha denna? -->

                        <input type="checkbox" id="Nöjespark" name="aktiviteter" value="Nöjespark">
                        <label for="Nöjespark">Nöjesparker</label>

                        <input type="checkbox" id="Temapark" name="aktiviteter" value="Temapark">
                        <label for="Temapark">Temaparker</label>

                        <input type="checkbox" id="Zipline" name="aktiviteter" value="Zipline">
                        <label for="Zipline">Zipline</label>

                        <input type="checkbox" id="Nöjescenter" name="aktiviteter" value="Nöjescenter">
                        <label for="Nöjescenter">Nöjescenter</label>

                        <input type="checkbox" id="Paintball" name="aktiviteter" value="Paintball">
                        <label for="Paintball">Paintball</label>

                        <input type="checkbox" id="Hälso" name="aktiviteter" value="Hälsocenter">
                        <label for="Hälsocenter">Hälsocenter</label>

                        <input type="checkbox" id="Biograf" name="aktiviteter" value="Biograf">
                        <label for="Biograf">Biografer</label>
                    </fieldset>
                </div>
            </div>
        </div>

        <div class="results">
            <div class="activity">
                <h3>Aktivitet</h3>
                <p>Stad, Landskap</p>
                <p>Pris</p>
                <button>Läs mer</button>
            </div>
        </div>
    </main>

    <footer>
        <p>Detta är inte ett riktigt företag/webbplats</p>
    </footer>
</body>

</html>
